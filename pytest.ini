[pytest]
testpaths = tests

# Test classes here are named for the behaviour they assert — "OnlyPending
# InvoicesCanBeSettled" rather than "TestPayment" — so the failure line
# reads as a sentence. pytest's default python_classes = Test* would
# collect none of them and report a cheerful zero failures, which is worse
# than no tests at all.
python_classes = *

filterwarnings =
    ignore::DeprecationWarning
